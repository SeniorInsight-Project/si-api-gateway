spring:
  application:
    name: si-api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/seniorinsight}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/seniorinsight/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: identity-service
          order: -1
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/identity/**
          filters:
            - StripPrefix=3
            - PrefixPath=/v1
        - id: notification-service
          order: -1
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=3
            - PrefixPath=/v1
        - id: backend-core-api
          uri: ${BACKEND_CORE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/**
        - id: backend-core-root
          uri: ${BACKEND_CORE_URI:http://localhost:8082}
          predicates:
            - Path=/

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
